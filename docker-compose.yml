version: "3.8"

services:
  # ── AgentPay Gateway (main entry point) ──────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentpay-gateway
    ports:
      - "${PORT:-8000}:8000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CHECKOUT_LINK: ${STRIPE_CHECKOUT_LINK:-http://localhost:8000/checkout}
      PORT: 8000
      LOCAL_BACKENDS: "0"
    depends_on:
      - search-proxy
      - agent-audit
      - agent-contract
      - agent-cost-tracker
      - agent-hire
      - agent-memory
      - agent-messaging
      - agent-passport
      - agent-proof
      - agent-team
      - agent-wallet
      - agent-legal-counsel
      - contract-analyzer
      - court-records
      - crypto-market
      - currency-exchange
      - database-mcp
      - dns-lookup
      - domain-data
      - domain-intel
      - email-agent
      - email-verify
      - file-converter
      - hackernews
      - hallucination-guard
      - image-analyzer
      - ip-geolocation
      - mcp-health-monitor
      - notification
      - patent-search
      - pdf-generator
      - qr-code
      - rental-agent
      - screenshot
      - sec-financial
      - secret-scanner
      - seo-audit
      - ssl-check
      - text-to-speech
      - weather
      - web-scraper
      - wikipedia
    restart: unless-stopped
    networks:
      - agentpay-net

  # ── Backend MCP Servers ──────────────────────────────────────────────────

  search-proxy:
    image: agentpay/search-proxy-mcp:latest
    container_name: search-proxy-mcp
    ports:
      - "8011:8011"
    environment:
      - PORT=8011
    restart: unless-stopped
    networks:
      - agentpay-net

  agent-audit:
